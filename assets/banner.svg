<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Animated Glow Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#f43f5e;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glassmorphism overlay gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #30363d; stroke-width: 1; stroke-opacity: 0.3; }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.2; }
      100% { transform: scale(1.05); opacity: 0.5; }
    }
    .wave-line {
      stroke-dasharray: 8 4;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" />

  <!-- Animated Grid & Dynamic Wave Graphics (Background Layer) -->
  <g class="pulse-circle" transform-origin="600 160">
    <circle cx="200" cy="80" r="180" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
    <circle cx="1000" cy="240" r="220" fill="#c084fc" opacity="0.12" filter="blur(50px)" />
  </g>

  <!-- Decorative Grid -->
  <path class="grid-line" d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" />
  <path class="grid-line" d="M 240,0 L 240,320 M 480,0 L 480,320 M 720,0 L 720,320 M 960,0 L 960,320" />

  <!-- Animated Flow Line -->
  <path class="wave-line" d="M 0,260 Q 300,180 600,250 T 1200,200" fill="none" stroke="url(#neon-glow)" stroke-width="3" opacity="0.6" />

  <!-- Foreground Glass Panel for High Contrast Text -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Dynamic Glowing Accent Bar -->
  <rect x="60" y="45" width="1080" height="4" rx="2" fill="url(#neon-glow)" />

  <!-- Title & Subtitle (Always Clear Foreground) -->
  <g filter="url(#shadow)">
    <!-- Main Icon Graphics: OS Symbols (Windows, Apple, Linux Tux silhouette representation) -->
    <g transform="translate(100, 95)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#1e293b" stroke="url(#neon-glow)" stroke-width="2" />
      <text x="28" y="38" text-anchor="middle" font-size="30">💻</text>
    </g>

    <text x="175" y="132" class="title-text">Awesome Desktop Operating Systems</text>
    <text x="175" y="172" class="subtitle-text">Curated List of Commercial Operating Systems &amp; Open-Source Distributions</text>
  </g>

  <!-- Interactive/Dynamic OS Category Badges (Pills) -->
  <g transform="translate(175, 205)">
    <!-- Windows Pill -->
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="60" y="21" text-anchor="middle" class="badge-pill">🪟 Windows</text>

    <!-- macOS Pill -->
    <rect x="132" y="0" width="110" height="32" rx="16" fill="#1e293b" stroke="#a7f3d0" stroke-width="1" />
    <text x="187" y="21" text-anchor="middle" class="badge-pill">🍎 macOS</text>

    <!-- Linux Pill -->
    <rect x="254" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#fde047" stroke-width="1" />
    <text x="304" y="21" text-anchor="middle" class="badge-pill">🐧 Linux</text>

    <!-- ChromeOS Pill -->
    <rect x="366" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
    <text x="431" y="21" text-anchor="middle" class="badge-pill">🌐 ChromeOS</text>

    <!-- Gaming & Productivity Pill -->
    <rect x="508" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="593" y="21" text-anchor="middle" class="badge-pill">🎮 Gaming &amp; Workstation</text>
  </g>
</svg>
